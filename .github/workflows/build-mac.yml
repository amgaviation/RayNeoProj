name: Build macOS app

# The .dmg has to be built on macOS — creating a disk image needs Apple's own
# tooling (hdiutil), so it cannot be cross-compiled from Linux. This runs on
# GitHub's macOS runners instead.
#
# Trigger it from the Actions tab ("Run workflow"), or push a v* tag to also get
# a GitHub Release with the artifacts attached.
#
# Note on cost: macOS runners bill at 10x the Linux rate on private repos. This
# workflow is manual-only by design — it does not run on every push.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to build
        type: choice
        default: both
        options: [both, arm64, intel]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Cheap gate on Linux before spending macOS minutes.
  #
  # electron-builder can assemble the whole .app bundle cross-platform — only
  # wrapping it into a .dmg needs Apple's tooling. So a config error or a missing
  # resource fails here in ~2 minutes on a 1x-billed runner instead of ten
  # minutes into a 10x-billed macOS one. Added after exactly that happened: an
  # invalid key in the `mac` config was only caught by the real build.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test

      - name: Build the single-file app
        run: npm run build:offline

      - name: Confirm the single file is self-contained
        # build:offline already fails on a leftover external reference; this also
        # asserts the artifact exists and is a plausible size.
        run: |
          f=download/RayNeo-Air4Pro-Configurator.html
          test -f "$f" || { echo "missing $f"; exit 1; }
          size=$(wc -c <"$f")
          echo "single-file build: $size bytes"
          test "$size" -gt 300000 || { echo "suspiciously small"; exit 1; }

      - name: Check the generated Unity reference is current
        # companion/RayNeoWorkspaceApplier.cs is committed so the generated shape
        # is reviewable in a diff, and the emitter is deterministic — so any
        # difference here means the exporter changed without the reference being
        # regenerated. Run `npm run emit:companion` to fix.
        run: |
          npm run emit:companion
          git diff --exit-code -- companion/ || {
            echo "::error::companion/ is stale — run 'npm run emit:companion' and commit the result"
            exit 1
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Assemble the .app bundle (no .dmg)
        working-directory: desktop
        run: npx electron-builder --mac --dir

      - name: Verify the bundle carries the app
        working-directory: desktop
        run: |
          app=$(find release -maxdepth 2 -name "*.app" | head -1)
          test -n "$app" || { echo "no .app produced"; exit 1; }
          test -f "$app/Contents/Resources/app/RayNeo-Air4Pro-Configurator.html" \
            || { echo "bundled page missing from $app"; exit 1; }
          echo "ok: $app"

  build:
    needs: validate
    # arm64 runner. Apple Silicon builds natively; electron-builder fetches the
    # x64 Electron binary for the Intel target.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Check types and run tests
        # A broken build should fail here, not silently ship in a .dmg.
        run: |
          npm run typecheck
          npm test

      - name: Build the single-file app
        run: npm run build:offline

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package the macOS app
        working-directory: desktop
        env:
          # Unsigned on purpose: there is no Apple Developer certificate in CI.
          # Skips the signing step rather than failing on a missing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "${{ inputs.arch || 'both' }}" in
            arm64) npm run dist:mac:arm ;;
            intel) npm run dist:mac:intel ;;
            *)     npm run dist:mac ;;
          esac

      - name: List what was produced
        working-directory: desktop
        run: ls -lh release/*.dmg release/*.zip 2>/dev/null || ls -lhR release

      - name: Upload the macOS app
        uses: actions/upload-artifact@v4
        with:
          name: rayneo-configurator-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload the single-file version
        uses: actions/upload-artifact@v4
        with:
          name: rayneo-configurator-single-file-html
          path: download/RayNeo-Air4Pro-Configurator.html
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            download/RayNeo-Air4Pro-Configurator.html
          body: |
            ## Install

            **macOS app** — download the `.dmg` for your Mac
            (`arm64` for Apple Silicon, `x64` for Intel), open it, and drag the app
            to Applications.

            The build is **unsigned**, so Gatekeeper will refuse it on first open.
            Right-click the app and choose **Open**, then confirm — once only. Or
            from Terminal:

            ```
            xattr -dr com.apple.quarantine "/Applications/RayNeo Air 4 Pro Configurator.app"
            ```

            **No install** — download `RayNeo-Air4Pro-Configurator.html` and
            double-click it. One self-contained file, works offline in any browser.
