# XcodeGen spec for BlueNudge. The generated BlueNudge.xcodeproj is committed, so
# you can open it directly; after editing this file run `xcodegen generate`
# (brew install xcodegen) to regenerate it.
#
# To use your own identifiers, change `bundleIdPrefix`, the two
# PRODUCT_BUNDLE_IDENTIFIER values and the iCloud container in both
# entitlements blocks (it must be the same in both), then regenerate.

name: BlueNudge

options:
  bundleIdPrefix: com.amgaviationgroup
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ReminderCore:
    path: Packages/ReminderCore

targets:
  BlueNudge:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
      - path: App/Shared
    dependencies:
      - package: ReminderCore
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: BlueNudge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/iOS/BlueNudge.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.amgaviationgroup.bluenudge
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amgaviationgroup.bluenudge
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  BlueNudgeRelay:
    type: application
    platform: macOS
    sources:
      - path: App/macOS
      - path: App/Shared
    dependencies:
      - package: ReminderCore
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: BlueNudge Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar app: no Dock icon.
        LSUIElement: true
        NSAppleEventsUsageDescription: BlueNudge Relay sends your scheduled reminders through the Messages app.
    entitlements:
      path: App/macOS/BlueNudgeRelay.entitlements
      properties:
        # Not sandboxed: the relay drives Messages with AppleScript and, with
        # Full Disk Access, reads ~/Library/Messages/chat.db. That also means it
        # cannot go on the Mac App Store; run it from Xcode or sign it with
        # Developer ID.
        com.apple.security.automation.apple-events: true
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.amgaviationgroup.bluenudge
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_NAME: BlueNudge Relay
        PRODUCT_BUNDLE_IDENTIFIER: com.amgaviationgroup.bluenudge.relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  # Runtime checks for the shared data layer and the relay's Messages plumbing:
  # SwiftData queries on an in-memory store, chat.db queries on a synthetic
  # database, and the AppleScript compiled against Messages' dictionary.
  # Plain logic tests (no host app), so running them never launches the relay.
  BlueNudgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BlueNudgeTests
      - path: App/Shared
      - path: App/macOS/ChatDatabase.swift
      - path: App/macOS/MessagesSender.swift
    dependencies:
      - package: ReminderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amgaviationgroup.bluenudge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BlueNudge:
    build:
      targets:
        BlueNudge: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BlueNudgeRelay:
    build:
      targets:
        BlueNudgeRelay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlueNudgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BlueNudgeTests:
    build:
      targets:
        BlueNudgeTests: [test]
    test:
      config: Debug
      targets:
        - BlueNudgeTests
